site_name: A Palavra de Haroldo Watson
site_description: "Um blog sobre computação, multimídia, opiniões perturbadoras e dominação global."
site_url: https://haroldowtsilva.github.io
site_author: Haroldo Watson

theme:
  name: material
  language: pt
  custom_dir: overrides
  palette:
    - scheme: default
      primary: blue grey
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/weather-night
        name: Mudar para o modo escuro
    - scheme: slate
      primary: blue grey
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/weather-sunny
        name: Mudar para o modo claro
  features:
    - navigation.tabs
    - content.code.copy
    - toc.follow

plugins:
  - blog:
      blog_dir: .
      post_dir: "{blog}/posts"
      post_date_format: dd/MM/yyyy
      post_url_format: "{date}/{slug}"
  - tags
  - search:
      lang: pt
  - rss:
      match_path: posts/.*
      date_from_meta:
        as_creation: date
      rss_feed_enabled: true
      json_feed_enabled: false
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true
      timezone: America/Fortaleza
      locale: pt
  - minify:
      minify_html: true

nav:
  - Blog: index.md
  - Recomendações: recomendacoes.md
  - Ideias para Jogos: ideias-jogos.md
  - Sobre: sobre.md

extra_javascript:
  - javascripts/frases.js

hooks:
  - hooks/redirects.py

extra:
  redirect_maps:
    # URLs antigas do Jekyll (.html) -> novas páginas
    '2025/06/21/inauguracao.html': 'posts/inauguracao.md'
    '2025/07/03/criar-blog-jekyll.html': 'posts/criar-blog-jekyll.md'
    '2025/08/17/svmlm.html': 'posts/svmlm.md'
    '2025/08/22/tutorial-stable-diffusion-cpp.html': 'posts/tutorial-stable-diffusion-cpp.md'
    '2025/09/11/embedding-tipografico.html': 'posts/embedding-tipografico.md'
    '2025/10/09/compressao-video-ffmpeg.html': 'posts/compressao-video-ffmpeg.md'
    '2025/10/19/acessando-irc-weechat.html': 'posts/acessando-irc-weechat.md'
    '2025/12/14/d6.html': 'posts/d6.md'
    '2025/12/27/investimento-solar-prolog.html': 'posts/investimento-solar-prolog.md'
    '2026/05/30/svm-biblio.html': 'posts/svm-biblio.md'
    posts.html: index.md
    posts/index.html: index.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
